{% if is_paginated %}
<nav class="mt-5" aria-label="Страницы">
  <ul class="pagination justify-content-center">
    {% if page_obj.has_previous %}
      <li class="page-item"><a class="page-link" href="?{% if request.GET.q %}q={{ request.GET.q|urlencode }}&{% endif %}page={{ page_obj.previous_page_number }}" aria-label="Назад">&laquo;</a></li>
    {% endif %}
    {% for num in page_obj.paginator.page_range %}
      <li class="page-item{% if num == page_obj.number %} active{% endif %}">
        <a class="page-link" href="?{% if request.GET.q %}q={{ request.GET.q|urlencode }}&{% endif %}page={{ num }}">{{ num }}</a>
      </li>
    {% endfor %}
    {% if page_obj.has_next %}
      <li class="page-item"><a class="page-link" href="?{% if request.GET.q %}q={{ request.GET.q|urlencode }}&{% endif %}page={{ page_obj.next_page_number }}" aria-label="Вперёд">&raquo;</a></li>
    {% endif %}
  </ul>
</nav>
{% endif %}
