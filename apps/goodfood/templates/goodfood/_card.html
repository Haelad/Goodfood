<div class="col-12 col-sm-6 col-lg-4 col-xl-3">
  <article class="food-card">
    <div class="food-card__photo">
      {% if food.photo %}
        <img src="{{ food.photo.url }}" alt="" loading="lazy" draggable="false">
      {% endif %}
    </div>

    <div class="food-card__body">
      {% if food.category %}
        <a href="{{ food.category.get_absolute_url }}" class="chip">{{ food.category }}</a>
      {% endif %}
      {# stretched-link делает кликабельной всю карточку #}
      <h2 class="food-card__title">
        <a href="{{ food.get_absolute_url }}" class="stretched-link">{{ food.name }}</a>
      </h2>
      {% if food.desc %}
        <p class="food-card__desc">{{ food.desc }}</p>
      {% endif %}
    </div>
  </article>
</div>
