<div class="col-12 col-sm-6 col-md-4 col-lg-3">
  <article class="card food-card h-100">
    {% if food.category %}
      <a href="{{ food.category.get_absolute_url }}" class="badge bg-success position-absolute top-0 start-0 mt-2 ms-2">{{ food.category }}</a>
    {% endif %}

    <div class="card-img-wrapper">
      {% if food.photo %}
        <img src="{{ food.photo.url }}" alt="{{ food.name }}" loading="lazy" draggable="false">
      {% endif %}
    </div>

    <div class="card-body text-center">
      <h5 class="card-title mb-2">{{ food.name }}</h5>
      <p class="card-text scroll-text mb-3">{{ food.desc|default:"" }}</p>
      <a href="{{ food.get_absolute_url }}" class="btn btn-primary mt-auto">Посмотреть</a>
    </div>
  </article>
</div>
