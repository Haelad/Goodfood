{% extends "base_auth.html" %}

{% block auth_title %}Сброс пароля{% endblock auth_title %}

{% block auth_content %}
<h1 class="auth-title">Сброс пароля</h1>
<p class="auth-text">Укажите email — мы отправим ссылку для смены пароля.</p>

<form method="post" action="{% url 'account_reset_password' %}">
  {% csrf_token %}
  {% include "account/_form_fields.html" %}
  <button type="submit" class="btn btn-primary w-100">Отправить письмо</button>
</form>

<div class="auth-links">
  <p><a href="{% url 'account_login' %}">Вернуться ко входу</a></p>
</div>
{% endblock auth_content %}
