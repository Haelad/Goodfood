{% extends "base_auth.html" %}

{% block auth_title %}Выход{% endblock auth_title %}

{% block auth_content %}
<h1 class="auth-title">Выход</h1>

<form method="post" action="{% url 'account_logout' %}">
  {% csrf_token %}
  <p class="auth-text">Вы уверены, что хотите выйти?</p>
  <button type="submit" class="btn btn-danger w-100">Выйти</button>
</form>
{% endblock auth_content %}
