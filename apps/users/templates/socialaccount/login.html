{% extends "base_auth.html" %}

{% block auth_title %}Вход через {{ provider.name }}{% endblock auth_title %}

{% block auth_content %}
<h1 class="auth-title">Подтверждение входа</h1>
<p class="auth-text">Вы собираетесь войти через <strong>{{ provider.name }}</strong>.</p>

<form method="post">
  {% csrf_token %}
  <button type="submit" class="btn btn-primary w-100">Продолжить</button>
</form>

<div class="auth-links">
  <p><a href="{% url 'account_login' %}">Назад к форме входа</a></p>
</div>
{% endblock auth_content %}
